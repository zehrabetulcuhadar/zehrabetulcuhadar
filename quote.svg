<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" role="img" aria-labelledby="t d">
  <title id="t">Atatürk sözü</title>
  <desc id="d">"Türk mühendislerinin alnında, Cumhuriyetin istikbalini aydınlatan ışık parıldar." — Mustafa Kemal Atatürk</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </radialGradient>
  </defs>
  <style>
    .glow{animation:breathe 6s ease-in-out infinite;transform-origin:400px 115px}
    .sp{transform-box:fill-box;transform-origin:center;opacity:0;animation-name:twinkle;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    .q{font-family:Georgia,'Times New Roman',serif;font-size:25px;font-style:italic;fill:#f0f6fc}
    .a{font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:bold;fill:#fcd34d;letter-spacing:.5px}
    @keyframes breathe{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
    @keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
    @media (prefers-reduced-motion:reduce){.glow,.sp{animation:none}.sp{opacity:.7}}
  </style>
  <ellipse class="glow" cx="400" cy="115" rx="390" ry="110" fill="url(#glow)"/>
  <g>
    <g transform="translate(60 50)"><path class="sp" style="animation-delay:0.0s;animation-duration:3.2s" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9Z" fill="url(#gold)"/></g>
    <g transform="translate(140 175)"><path class="sp" style="animation-delay:1.1s;animation-duration:2.8s" d="M0 -6 Q0 0 6 0 Q0 0 0 6 Q0 0 -6 0 Q0 0 0 -6Z" fill="url(#gold)"/></g>
    <g transform="translate(215 38)"><path class="sp" style="animation-delay:0.6s;animation-duration:3.6s" d="M0 -7 Q0 0 7 0 Q0 0 0 7 Q0 0 -7 0 Q0 0 0 -7Z" fill="url(#gold)"/></g>
    <g transform="translate(330 190)"><path class="sp" style="animation-delay:1.8s;animation-duration:2.6s" d="M0 -5 Q0 0 5 0 Q0 0 0 5 Q0 0 -5 0 Q0 0 0 -5Z" fill="url(#gold)"/></g>
    <g transform="translate(450 32)"><path class="sp" style="animation-delay:0.3s;animation-duration:3.0s" d="M0 -6 Q0 0 6 0 Q0 0 0 6 Q0 0 -6 0 Q0 0 0 -6Z" fill="url(#gold)"/></g>
    <g transform="translate(560 185)"><path class="sp" style="animation-delay:1.4s;animation-duration:3.4s" d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8Z" fill="url(#gold)"/></g>
    <g transform="translate(660 45)"><path class="sp" style="animation-delay:0.9s;animation-duration:2.9s" d="M0 -7 Q0 0 7 0 Q0 0 0 7 Q0 0 -7 0 Q0 0 0 -7Z" fill="url(#gold)"/></g>
    <g transform="translate(740 170)"><path class="sp" style="animation-delay:0.2s;animation-duration:3.8s" d="M0 -10 Q0 0 10 0 Q0 0 0 10 Q0 0 -10 0 Q0 0 0 -10Z" fill="url(#gold)"/></g>
    <g transform="translate(95 115)"><path class="sp" style="animation-delay:2.0s;animation-duration:2.7s" d="M0 -5 Q0 0 5 0 Q0 0 0 5 Q0 0 -5 0 Q0 0 0 -5Z" fill="url(#gold)"/></g>
    <g transform="translate(705 110)"><path class="sp" style="animation-delay:1.6s;animation-duration:3.1s" d="M0 -6 Q0 0 6 0 Q0 0 0 6 Q0 0 -6 0 Q0 0 0 -6Z" fill="url(#gold)"/></g>
    <g transform="translate(400 205)"><path class="sp" style="animation-delay:0.7s;animation-duration:2.5s" d="M0 -4 Q0 0 4 0 Q0 0 0 4 Q0 0 -4 0 Q0 0 0 -4Z" fill="url(#gold)"/></g>
    <g transform="translate(270 205)"><path class="sp" style="animation-delay:2.3s;animation-duration:3.3s" d="M0 -5 Q0 0 5 0 Q0 0 0 5 Q0 0 -5 0 Q0 0 0 -5Z" fill="url(#gold)"/></g>
  </g>
  <text class="q" x="400" y="98" text-anchor="middle">“Türk mühendislerinin alnında, Cumhuriyetin</text>
  <text class="q" x="400" y="134" text-anchor="middle">istikbalini aydınlatan ışık parıldar.”</text>
  <text class="a" x="400" y="178" text-anchor="middle">— Mustafa Kemal Atatürk</text>
</svg>